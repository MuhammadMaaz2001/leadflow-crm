# Reference topology for a SINGLE HOST (staging, small installs). For production prefer managed PostgreSQL and Redis
# (set APP_DATABASE_URL / REDIS_URL to them and delete the two services below). Secrets come from the environment / an env_file
# that is NOT committed:  docker compose --env-file deploy/.env.production -f deploy/docker-compose.example.yml up -d
# Not executed in the development environment (no Docker daemon): treat as a starting point.
services:
  migrate:
    build: { context: .., target: migrate }
    env_file: .env.production
    depends_on: { postgres: { condition: service_healthy } }
    restart: "no"
  api:
    build: { context: .., target: api }
    env_file: .env.production
    ports: ["4000:4000"]
    depends_on: { migrate: { condition: service_completed_successfully }, redis: { condition: service_started } }
    restart: unless-stopped
    deploy: { replicas: 2 }          # stateless: any number of instances (rate limits and locks live in Redis)
  worker:
    build: { context: .., target: worker }
    env_file: .env.production
    depends_on: { migrate: { condition: service_completed_successfully }, redis: { condition: service_started } }
    restart: unless-stopped
    stop_grace_period: 30s           # lets in-flight jobs finish on SIGTERM
    deploy: { replicas: 2 }          # the scheduler lock guarantees one scheduler tick at a time
  web:
    build: { context: .., target: web, args: { API_URL: "http://api:4000" } }
    ports: ["3000:3000"]
    environment: { CSP_UPGRADE_INSECURE_REQUESTS: "true" }
    depends_on: [api]
    restart: unless-stopped
  postgres:
    image: postgres:16
    environment: { POSTGRES_USER: leadflow, POSTGRES_PASSWORD: "${POSTGRES_OWNER_PASSWORD:?set in the env file}", POSTGRES_DB: leadflow }
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U leadflow"], interval: 5s, retries: 10 }
  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes: ["redisdata:/data"]
volumes: { pgdata: {}, redisdata: {} }
